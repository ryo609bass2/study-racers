name: Publish Study Racers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  check:
    name: Check the HTML game
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.prepare.outputs.artifact_name }}
    steps:
      - name: Check out the game
        uses: actions/checkout@v6
      - name: Verify questions and complete a race
        run: node scripts/check.cjs
      - name: Prepare the public files
        id: prepare
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          echo "artifact_name=github-pages-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: ${{ steps.prepare.outputs.artifact_name }}

  deploy:
    name: Publish to GitHub Pages
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.check.outputs.artifact_name }}
