.selection legend{margin-bottom:8px;color:#f7f9ee;font-size:16px}

.selection-option{display:block;position:relative;min-width:0;cursor:pointer}
.selection-option input{position:absolute;width:1px;height:1px;opacity:0;margin:0}
.selection-card{display:flex;position:relative;height:100%;flex-direction:column;align-items:stretch;overflow:hidden;padding:8px 8px 9px;gap:4px;border:2px solid #557484b0;border-radius:12px;background:#102b3df2;color:#f4f8f6}
.selection-card strong{font-size:clamp(11px,1.2vw,16px);line-height:1.25;overflow-wrap:anywhere;align-self:center;text-align:center}
.selection-option input:checked+.selection-card{border-color:#ffc45d;box-shadow:inset 0 0 0 1px #ffc45d88;background:#1b3749}
.selection-option input:checked+.selection-card::after{content:'✓';display:grid;place-items:center;position:absolute;top:5px;right:5px;width:19px;height:19px;border-radius:50%;background:#ffc45d;color:#253241;font-size:12px;font-weight:900}
.selection-option input:focus-visible+.selection-card{outline:3px solid #72ebec;outline-offset:2px}
.selection-card canvas{display:block;width:100%;height:auto;object-fit:contain;max-height:70px;border-radius:7px}
.course-card canvas{background:radial-gradient(ellipse at 50% 45%,#387965,#1c4e48)}
.course-card[data-theme="forest"] canvas{background:radial-gradient(ellipse at 50% 45%,#526e3c,#244539)}
.course-card[data-theme="coast"] canvas{background:radial-gradient(ellipse at 50% 45%,#357581,#19475b)}
.vehicle-card canvas{background:radial-gradient(ellipse at 50% 45%,#416071,#172f42);max-height:56px}
.vehicle-card strong{color:var(--vehicle-color);margin-bottom:3px}
.vehicle-metric{display:grid;grid-template-columns:3.2em minmax(0,1fr);align-items:center;gap:5px;font-size:11px;color:#d6e4e6;line-height:1.08}
.vehicle-metric meter{width:100%;height:8px;appearance:none;background:none}
.vehicle-metric meter::-webkit-meter-bar{background:#314b5c;border:0;border-radius:4px}
.vehicle-metric meter::-webkit-meter-optimum-value{background:var(--vehicle-color);border-radius:4px}
.vehicle-metric meter::-moz-meter-bar{background:var(--vehicle-color);border-radius:4px}
.selection-note{font-size:13px;color:#d8e7e5;margin:6px 0 0;min-height:1.35em}
.setup-card{padding:21px 24px 16px}
.setup-card h2{margin:0 0 16px}
.setup-card fieldset{margin-bottom:14px}
.menu-footer{position:static;grid-column:1/-1;justify-content:space-between;margin:0;gap:12px}
.playing #app{height:100dvh;min-height:0}
.playing #world{height:100dvh}
.playing .topbar{pointer-events:none}
.playing .topbar a,.playing .topbar button{pointer-events:auto}
.hud-top{top:72px}
.mini-panel{top:72px;right:calc(4.2% + 156px);width:146px}
.hud-bottom{bottom:52px}
.drive-guide{bottom:15px}
.touch-drive{display:none}
.player-name{white-space:nowrap}
@media(max-width:980px){
  .menu{gap:16px;grid-template-columns:minmax(0,1fr) minmax(280px,325px)}
  .setup-card{padding:18px}
}
@media(max-width:690px){
  .topbar,.playing .topbar{height:53px;padding:0 12px;gap:6px}
  .brand{font-size:12px;gap:5px}
  .brand-mark{width:22px;height:24px;font-size:22px}
  .top-actions{gap:4px}
  .top-actions button{font-size:11px;padding:6px 7px;min-height:33px}
  .menu{display:grid;grid-template-columns:minmax(0,1fr);padding:10px 12px 16px;min-height:0;gap:11px}
  .garage-title{margin-bottom:10px}
  .garage h1{font-size:28px}
  .selection legend{font-size:14px;margin-bottom:5px}
  .choice-grid{gap:5px}
  .selection-card{padding:4px 4px 6px;gap:3px}
  .selection-card strong{font-size:11px}
  .selection-note{font-size:12px}
  .setup-card{width:100%;max-width:none;margin:0}
  .menu-footer{font-size:11px}
  .hud-top{top:57px;left:8px;right:8px;display:flex;gap:6px;justify-content:space-between}
  .place-panel,.lap-panel{padding:6px 9px;min-width:0}
  .place-panel strong,.lap-panel strong{font-size:24px}
  .player-name{display:none}
  #timer{font-size:11px}
  .mini-panel{display:block;top:57px;left:50%;right:auto;transform:translateX(-50%);width:90px;padding:3px}
  .mini-panel canvas{height:34px;object-fit:contain}
  .mini-panel>span{display:block;font-size:9px}
  .notice{top:122px;max-width:calc(100% - 20px);padding:5px 8px;font-size:11px}
  .hud-bottom{left:8px;right:8px;bottom:39px;gap:6px}
  .hud-bottom .boost-panel,.hud-bottom .item-panel{min-width:0;width:auto;flex:1;padding:6px 8px}
  .item-glyph,.speed-panel,.hud-action kbd,.item-panel .hud-label{display:none}
  .item-panel strong{font-size:11px;margin:0}
  .energy-track{height:4px;margin:4px 0}
  .boost-panel strong{font-size:14px}
  .hud-action{min-height:31px;font-size:12px}
  .drive-guide{left:9px;right:9px;bottom:8px;font-size:10px}
  .toast{bottom:155px}
}
@media(pointer:coarse), (max-width:600px){
  .touch-drive{display:flex;position:absolute;bottom:max(8px,env(safe-area-inset-bottom));left:8px;right:8px;justify-content:space-between;gap:6px;pointer-events:none}
  .touch-group{display:flex;gap:5px}
  .touch-group button{min-height:47px;min-width:46px;padding:3px 6px;touch-action:none;user-select:none;background:#123044ee;color:#f5f8ff;border:1px solid #99c9d477;border-radius:9px;font-size:13px;font-weight:700;pointer-events:none}
  .drive-active .touch-group button{pointer-events:auto}
  .touch-group button:active{background:#ffd067;color:#182e3d}
  .hud-bottom{bottom:60px}
  .drive-guide{bottom:max(15px,env(safe-area-inset-bottom));top:auto;left:50%;right:auto;transform:translateX(-50%);pointer-events:none}
  .drive-guide span,.drive-guide kbd{display:none}
  .drive-guide button{background:#15384c;border-radius:6px;padding:8px;white-space:nowrap;pointer-events:auto}
  .hud-action{min-height:36px}
}
@media (max-height:520px) and (min-width:691px){
  .playing .topbar{height:48px}
  .hud-top,.mini-panel{top:50px}
  .mini-panel{width:92px}
  .hud-bottom{padding:0;left:8px;right:8px}
  .hud-bottom .speed-panel{display:none}
  .hud-bottom .boost-panel,.hud-bottom .item-panel{padding:6px 10px}
}

<body>
<div id="app">
  <canvas id="world" aria-label="スタディレーサーズのレース画面"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="#" id="brand" aria-label="スタディレーサーズのタイトル"><span class="brand-mark">ϟ</span><span>STUDY<span class="brand-light"> RACERS</span></span></a>
    <div class="top-actions"><button id="soundBtn" class="icon-button" aria-label="音を切り替える" title="音を切り替える">音 ON</button><button id="helpBtn" class="icon-button">あそび方</button><button id="pauseBtn" class="icon-button" hidden>一時停止</button></div>
  </header>

  <main id="menu" class="menu">
    <section class="garage">
      <div class="garage-title"><div class="eyebrow">小学6年生の算数 × レーシング</div>
      <h1>スタディ<span>レーサーズ</span></h1></div>
      <fieldset class="selection"><legend>コースをえらぶ</legend><div id="courseChoices" class="choice-grid"></div><p id="courseDescription" class="selection-note" aria-live="polite"></p></fieldset>
      <fieldset class="selection"><legend>車をえらぶ</legend><div id="vehicleChoices" class="choice-grid"></div><p id="vehicleDescription" class="selection-note" aria-live="polite"></p></fieldset>
    </section>
    <section class="setup-card" aria-labelledby="setupTitle">
      <h2 id="setupTitle">きょうのレース</h2>
      <form id="setupForm">
        <fieldset><legend>学ぶ単元 <small>1つ以上選ぼう</small></legend><div class="unit-options">
          <label><input type="checkbox" name="unit" value="fraction" checked><span><b>½</b> 分数の乗除</span></label>
          <label><input type="checkbox" name="unit" value="ratio" checked><span><b>2:3</b> 比</span></label>
          <label><input type="checkbox" name="unit" value="proportion" checked><span><b>↗</b> 比例</span></label>
        </div></fieldset>
        <div class="settings-row"><label for="learning">算数のむずかしさ</label><select id="learning"><option value="support">サポート</option><option value="standard" selected>標準</option><option value="challenge">チャレンジ</option></select></div>
        <div class="settings-row"><label for="cpu">CPUのつよさ</label><select id="cpu"><option value="easy">やさしい</option><option value="normal" selected>ふつう</option><option value="hard">つよい</option></select></div>
        <label class="assist-option"><span><strong>運転アシスト</strong><small>自動アクセルとハンドルのお手伝い</small></span><input id="assist" type="checkbox" role="switch" checked><span class="switch" aria-hidden="true"></span></label>
        <details class="display-settings"><summary>文字・画面の設定</summary><label><input id="largeText" type="checkbox"> 問題の文字を大きくする</label><label><input id="reduced" type="checkbox"> 画面の動きを少なくする</label></details>
        <p id="setupError" class="error" role="alert"></p>
        <button class="primary start-button" type="submit">レースをはじめる <span class="flag-mark" aria-hidden="true">▧</span></button>
        <p class="setup-foot">3周 約3〜5分 ＋ 問題を考える時間</p>
      </form>
    </section>
    <footer class="menu-footer"><span>3周・算数5問・4台レース</span><button id="historyBtn" class="text-button">この端末のレース記録</button></footer>
  </main>

  <section id="hud" aria-label="走行情報" hidden>
    <div class="hud-top"><div class="place-panel"><span class="hud-label">順位</span><strong id="position">1<span>/ 4</span></strong><span class="player-name" id="playerName">スタンダード</span></div><div class="lap-panel"><span class="hud-label">周回</span><strong id="lap">1 <span>/ 3</span></strong><div id="timer">00:00.00</div></div></div>
    <div id="notice" class="notice" aria-live="polite"></div>
    <div class="mini-panel"><canvas id="minimap" width="240" height="170" aria-label="コース上の車の位置"></canvas><span id="questionProgress">算数チャレンジ 0 / 5</span></div>
    <div class="hud-bottom"><div class="speed-panel"><strong id="speed">0</strong><span>km/h</span><small id="assistLabel">アシスト ON</small></div><div class="boost-panel"><div><span>BOOST ENERGY</span><strong id="energy">0 <small>/ 100</small></strong></div><div class="energy-track"><div id="energyBar"></div><i></i></div><button id="boostBtn" class="hud-action"><kbd>Space</kbd> ブースト <small>−40</small></button></div><div class="item-panel"><div class="item-glyph" id="itemGlyph">◇</div><div><span class="hud-label">ITEM</span><strong id="itemName">アイテムなし</strong><button id="itemBtn" class="hud-action"><kbd>E</kbd> つかう</button></div></div></div>
    <div class="drive-guide"><span><kbd>←</kbd><kbd>→</kbd> ハンドル</span><span><kbd>↑</kbd> アクセル <kbd>↓</kbd> ブレーキ</span><button id="recoverBtn"><kbd>R</kbd> コースに戻る</button></div>
    <div class="touch-drive" id="touchDrive" aria-label="画面で運転">
      <div class="touch-group"><button type="button" data-drive="ArrowLeft" aria-label="左に曲がる">◀</button><button type="button" data-drive="ArrowRight" aria-label="右に曲がる">▶</button></div>
      <div class="touch-group"><button type="button" data-drive="ArrowDown">ブレーキ</button><button type="button" data-drive="ArrowUp">アクセル</button></div>
    </div>
  </section>
  <div id="countdown" class="countdown" hidden><span id="countdownLabel">READY?</span><strong id="countdownNumber">3</strong><small>← → でハンドル操作</small></div>
  <div id="toast" class="toast" role="status"></div>
  <section id="overlay" class="overlay" hidden><div id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" tabindex="-1"></div></section>
  <div id="live" class="sr-only" aria-live="polite"></div>
</div>
<script>
/* Study Racers: deterministic simulation, independent of the browser UI. */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  root.StudyCore = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';
  const DT = 1 / 60, TAU = Math.PI * 2;
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const wrap = n => ((n % TAU) + TAU) % TAU;
  const angle = n => ((n + Math.PI) % TAU + TAU) % TAU - Math.PI;
  function rng(seed) { let a = seed >>> 0; return () => { a += 0x6D2B79F5; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function shuffle(a, random) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const segments = [];
  function line(x, y, h, length) { segments.push({x, y, h, length, kind:'line'}); }
  function arc(cx, cy, start) { segments.push({cx, cy, start, length:30 * Math.PI, kind:'arc'}); }
  line(270,60,0,150); arc(420,120,-Math.PI/2); line(480,120,Math.PI/2,180);
  arc(420,300,0); line(420,360,Math.PI,300); arc(120,300,Math.PI/2);
  line(60,300,-Math.PI/2,180); arc(120,120,Math.PI); line(120,60,0,150);
  function makeCourse(definition, segments) {
  let L = 0;
  segments.forEach(segment => {segment.s=L; L+=segment.length;});
  const widthAt = s => {
    const fraction = ((s % L) + L) % L / L;
    const widened = definition.widen && Math.max(0, 1 - Math.abs(fraction - definition.widen) / .09);
    return definition.width / 2 + 2 * (widened || 0);
  };
  function at(s, offset=0) {
    s = ((s % L) + L) % L;
    const seg = segments.find(p => s < p.s + p.length) || segments[segments.length-1];
    const t = s - seg.s;
    let x, y, h;
    if (seg.kind === 'line') {h=seg.h; x=seg.x+Math.cos(h)*t; y=seg.y+Math.sin(h)*t;}
    else {
      const radius=seg.radius || 60, sign=seg.sign || 1, a=seg.start+sign*t/radius;
      x=seg.cx+radius*Math.cos(a); y=seg.cy+radius*Math.sin(a); h=a+sign*Math.PI/2;
    }
    return {x:x-Math.sin(h)*offset,y:y+Math.cos(h)*offset,h:angle(h),
      curvature:seg.kind==='arc'?(seg.sign || 1)/(seg.radius || 60):0, halfWidth:widthAt(s)};
  }
  const sampleCount=Math.ceil(L/2), sampleStep=L/sampleCount;
  const samples=Array.from({length:sampleCount},(_,i)=>({...at(i*sampleStep),s:i*sampleStep}));
  function project(x,y,previousIndex) {
    let best={dist2:Infinity};
    const start=previousIndex===undefined?0:previousIndex-36, end=previousIndex===undefined?sampleCount:previousIndex+37;
    for(let k=start;k<end;k++) {
      const i=(k%sampleCount+sampleCount)%sampleCount,a=samples[i],b=samples[(i+1)%sampleCount];
      const dx=b.x-a.x,dy=b.y-a.y,t=clamp(((x-a.x)*dx+(y-a.y)*dy)/(dx*dx+dy*dy),0,1);
      const px=a.x+dx*t,py=a.y+dy*t,d=(x-px)**2+(y-py)**2;
      if(d<best.dist2) best={dist2:d,index:i,s:(i+t)*sampleStep%L,x:px,y:py,h:Math.atan2(dy,dx), lateral:((x-px)*-dy+(y-py)*dx)/Math.hypot(dx,dy)};
    }
    return best;
  }
  // Each gate lives on a straight, and the same absolute distances are used for
  // rendering, warnings and forward-only crossing.
  const gates=definition.gates || segments
    .filter(seg=>seg.kind==='line'&&seg.length>=120)
    .slice(0,2).map(seg=>(seg.s+seg.length*.61)/L);
  const [a,b]=gates;
  const quizDistances=[a,b,1+a,1+b,2+a].map(fraction=>fraction*L);
  const objects=definition.objects.map(([type,fraction,offset],i)=>{
    const s=fraction*L;
    return {id:type+i,type,s,offset,...at(s,offset)};
  });
  return {...definition,L,at,project,samples,objects,gates,quizDistances,checkpointStep:L/12};
  }

  // Apply a circular fillet at each control point. Adjacent lines and arcs
  // share their endpoints and tangents, including the start/finish seam.
  function roundedLoop(nodes, startDistance=105) {
    const corners=nodes.map(([x,y,trim],i)=>{
      const previous=nodes[(i+nodes.length-1)%nodes.length],next=nodes[(i+1)%nodes.length];
      const inHeading=Math.atan2(y-previous[1],x-previous[0]);
      const outHeading=Math.atan2(next[1]-y,next[0]-x);
      const turn=angle(outHeading-inHeading), sign=Math.sign(turn);
      const radius=trim/Math.tan(Math.abs(turn)/2);
      const entry=[x-Math.cos(inHeading)*trim,y-Math.sin(inHeading)*trim];
      const exit=[x+Math.cos(outHeading)*trim,y+Math.sin(outHeading)*trim];
      return {entry,exit,arc:{
        kind:'arc',radius,sign,start:inHeading-sign*Math.PI/2,
        cx:entry[0]-Math.sin(inHeading)*radius*sign,
        cy:entry[1]+Math.cos(inHeading)*radius*sign,length:radius*Math.abs(turn)
      }};
    });
    const straight=(from,to)=>({kind:'line',x:from[0],y:from[1],
      h:Math.atan2(to[1]-from[1],to[0]-from[0]),length:Math.hypot(to[0]-from[0],to[1]-from[1])});
    const first=straight(corners[0].exit,corners[1].entry);
    const start=[first.x+Math.cos(first.h)*startDistance,first.y+Math.sin(first.h)*startDistance];
    const result=[straight(start,corners[1].entry)];
    for(let i=1;i<=corners.length;i++){
      const corner=corners[i%corners.length];
      result.push(corner.arc,straight(corner.exit,i===corners.length?start:corners[(i+1)%corners.length].entry));
    }
    return result;
  }
  const standardObjects=[['box',.30,5],['box',.80,-5],['cone',.33,6],['cone',.83,-6]];
  const courses={
    school:makeCourse({id:'school',name:'スクールサーキット',description:'広い道と長い直線。追い越しに挑戦しよう。',
      tag:'広い道と長い直線',theme:'school',width:20,widen:.48,bounds:[540,420],gates:[.06,.52],objects:standardObjects},segments),
    forest:makeCourse({id:'forest',name:'フォレストSロード',description:'右・左と続くカーブ。出口で加速しよう。',
      tag:'右・左へ曲がるS字',theme:'forest',width:21,bounds:[690,530],
      objects:[['box',.33,-5],['box',.77,5],['cone',.38,-6],['cone',.83,5]]},
    roundedLoop([[70,165,48],[300,165,32],[395,92,36],[514,92,34],[610,210,48],[610,416,54],[115,445,55],[70,370,38]],28)),
    coast:makeCourse({id:'coast',name:'シーサイドヘアピン',description:'海沿いの直線から急な折り返しへ。減速と加速がカギ。',
      tag:'直線とヘアピン',theme:'coast',width:22,bounds:[710,500],
      objects:[['box',.44,-5],['box',.74,5],['cone',.49,6],['cone',.79,-6]]},
    roundedLoop([[75,86,52],[640,86,31],[640,174,31],[330,174,46],[250,265,42],[258,370,43],[128,429,47],[70,333,47]],84))
  };
  const vehicles={
    standard:{id:'standard',name:'スタンダード',description:'どのコースでも走りやすい',number:'01',color:'#ffbc45',accel:1,top:1,turn:1},
    corner:{id:'corner',name:'コーナー',description:'小回りと立ち上がりが得意',number:'02',color:'#54e0c8',accel:1.08,top:.95,turn:1.15},
    sprint:{id:'sprint',name:'スプリント',description:'長い直線でスピードが伸びる',number:'03',color:'#ff839b',accel:.92,top:1.08,turn:.93}
  };
  const {L,at,project,samples,objects,quizDistances}=courses.school;
  const colors=['#ffb83d','#53cbff','#b6ed80','#b39bff'];
  const items=['shield','grip','recovery'];
  const pace={easy:[.78,.82,.86],normal:[.90,.94,.98],hard:[.96,.99,1]};
  function validateBank(bank) {
    if(!Array.isArray(bank)) throw new Error('問題データを読み込めません。');
    const ids=new Set();
    for(const q of bank) {
      if(ids.has(q.id)||q.choices.length!==3||new Set(q.choices.map(c=>c.id)).size!==3||!q.choices.some(c=>c.id===q.correctChoiceId)||!q.explanation||!q.hint) throw new Error('問題データを確認してください: '+q.id);
      ids.add(q.id);
    }
  }
  function chooseQuestions(bank,config,recent=[]) {
    validateBank(bank);
    const random=rng(config.seed),units=shuffle(config.units,random);
    if(!units.length) throw new Error('単元を1つ以上選んでください。');
    const selected=[];
    for(let i=0;i<units.length;i++) {
      const count=Math.floor(5/units.length)+(i<5%units.length?1:0);
      let pool=shuffle(bank.filter(q=>q.unit===units[i]&&q.level===config.learning),random);
      pool.sort((a,b)=>Number(recent.includes(a.id))-Number(recent.includes(b.id)));
      if(pool.length<count) throw new Error('選んだ単元・難易度の問題が足りません。');
      selected.push(...pool.slice(0,count));
    }
    return shuffle(selected,random).map(q=>({...q,choices:shuffle(q.choices,random)}));
  }
  function car(id,s,offset,course,vehicle) {

    return rows?`<div class="support-visual"><small>2つの量を表で見てみよう</small><table class="support-table"><tbody>${rows.map(row=>`<tr><th scope="row">${row[0]}</th><td>${row[1]}</td><td>${row[2]}</td></tr>`).join('')}</tbody></table></div>`:'';

  let race=null,keys={},lastFrame=performance.now(),accumulator=0,menuTime=0,cam={x:270,y:60},width=1280,height=720,dpr=1,modalKind=null,returnFocus=null,reviewIndex=0,reviewChoice=null,reviewAnswered=false,toastTimer=0,audio=null,sound=true,large=false,reduced=false,lastCount=-1,savedRace=null,storageOk=true;

        if(!used){g.fillStyle='#164450';g.font='bold 2px sans-serif';g.textAlign='center';g.fillText('+',o.x,o.y+.72);}
      }else{
        g.fillStyle='#232c3e66';g.fillRect(o.x-1.17,o.y-.9,2.4,2.4);
        g.fillStyle='#ff9454';g.beginPath();g.arc(o.x,o.y,1.1,0,Math.PI*2);g.fill();
        g.strokeStyle='#fff1bf';g.lineWidth=.27;g.beginPath();g.arc(o.x,o.y,.67,0,Math.PI*2);g.stroke();
      }
    }
  }
  function resetCamera(){
    const p=race.player;
    cam={x:p.x,y:p.y,h:race.course.at(p.s+11).h,cornerZoom:0};
  }
  function drawWorld(dt){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const course=activeCourse(),[w,h]=course.bounds,ground=palettes[course.theme];
    ctx.fillStyle=ground.ground;ctx.fillRect(0,0,width,height);
    const map=paintMap(course);
    if(!race){
      const zoom=Math.max(width/w,height/h)*1.12;
      ctx.save();ctx.translate(width/2,height/2);ctx.scale(zoom,zoom);
      ctx.translate(-w/2,-h/2);ctx.drawImage(map,0,0,w,h);
      const vehicle=C.vehicles[selected('vehicleId')] || C.vehicles.standard;
      for(let i=3;i>=0;i--){
        const p=course.at(menuTime*18+85-i*15,i%2?4:-4);
        drawCar(ctx,{...p,vehicle:i===0?vehicle:C.vehicles.standard,color:i===0?vehicle.color:C.colors[i]},1.4);
      }
      ctx.restore();return;
    }
    const p=race.player;
    const quiet=reduced||motionPreference.matches, forward=course.at(p.s+11);
    const a=1-Math.exp(-dt/(quiet?.10:.16));
    if(race.state==='RACING'){
      cam.x+=(p.x-cam.x)*a;cam.y+=(p.y-cam.y)*a;
      cam.h+=C.angle(forward.h-cam.h)*(1-Math.exp(-dt/.34));
      const corner=Math.min(.08,Math.abs(course.at(p.s+24).curvature)*2.5);
      cam.cornerZoom+=(corner-cam.cornerZoom)*(1-Math.exp(-dt/.26));
    }
    const scale=C.clamp(width/95+4.55,8.45,11.9);
    const corner=quiet?0:cam.cornerZoom;
    const zoom=scale*(1-corner),rotation=quiet?0:-cam.h-Math.PI/2,tilt=quiet?1:.88;
    const anchorY=height*(quiet?.52:.59),cos=Math.cos(rotation),sin=Math.sin(rotation);
    ctx.save();ctx.translate(width*.5,anchorY);ctx.scale(zoom,zoom*tilt);ctx.rotate(rotation);
    ctx.translate(-cam.x,-cam.y);ctx.drawImage(map,0,0,w,h);drawGates(ctx,course);drawObjects(ctx,course);
    const cars=race.cars.filter(c=>c.id===0||c.finish===null);
    cars.sort((a,b)=>(a.x-b.x)*sin+(a.y-b.y)*cos);
    for(const c of cars)drawCar(ctx,c);
    ctx.restore();
    const dx=p.x-cam.x,dy=p.y-cam.y;
    const markerY=anchorY+(dx*sin+dy*cos)*zoom*tilt;
    playerMarker(ctx,width*.5+(dx*cos-dy*sin)*zoom,markerY-34,'YOU');
  }
  function drawMini(){
    if(!race)return;
    const course=race.course,g=$('minimap').getContext('2d'),[w,h]=course.bounds;
    const scale=Math.min(224/w,150/h);
    g.clearRect(0,0,240,170);g.save();g.translate((240-w*scale)/2,(170-h*scale)/2);g.scale(scale,scale);
    path(g,course);g.lineWidth=20;g.strokeStyle='#7597a2';g.stroke();
    const nextGate=course.quizDistances[race.quizIndex];
    if(nextGate!==undefined){const p=course.at(nextGate);g.fillStyle='#69e7dc';g.fillRect(p.x-9,p.y-9,18,18);}
    for(const c of [...race.cars].reverse()){
      g.fillStyle=c.color;g.beginPath();g.arc(c.x,c.y,c.id===0?13:8,0,2*Math.PI);g.fill();
      if(c.id===0){g.strokeStyle='#fff3bb';g.lineWidth=3;g.stroke();}
    }
    g.restore();
  }
  function setupGarage(){
    $('courseChoices').innerHTML=Object.values(C.courses).map(course=>
      '<label class="selection-option"><input type="radio" name="courseId" value="'+course.id+'">'
      +'<span class="selection-card course-card" data-theme="'+course.theme+'"><canvas width="270" height="118" aria-hidden="true"></canvas>'
      +'<strong>'+course.name+'</strong></span></label>').join('');
    $('vehicleChoices').innerHTML=Object.values(C.vehicles).map(vehicle=>{
      const metrics=vehicleMetrics.map(([name,key,min,max])=>{
        const score=Math.round(30+70*(vehicle[key]-min)/(max-min));
        return '<span class="vehicle-metric"><span>'+name+'</span><meter min="0" max="100" value="'+score+'" aria-label="'+name+'"></meter></span>';
      }).join('');
      return '<label class="selection-option"><input type="radio" name="vehicleId" value="'+vehicle.id+'">'
        +'<span class="selection-card vehicle-card" style="--vehicle-color:'+vehicle.color+'">'
        +'<canvas width="270" height="100" aria-hidden="true"></canvas><strong>'+vehicle.name+'</strong>'+metrics+'</span></label>';
    }).join('');
    for(const input of document.querySelectorAll('.selection-option input')){
      const id=input.value,g=input.nextElementSibling.querySelector('canvas').getContext('2d');
      if(input.name==='courseId'){
        const course=C.courses[id],[w,h]=course.bounds;
        const scale=Math.min(215/w,106/h);g.save();g.translate((270-w*scale)/2,(118-h*scale)/2);g.scale(scale,scale);
        path(g,course);g.strokeStyle=palettes[course.theme].trim;g.lineWidth=19;g.stroke();
        path(g,course);g.strokeStyle='#edf7ea';g.lineWidth=5;g.stroke();
        const p=course.at(0);g.fillStyle='#fff3bc';g.beginPath();g.arc(p.x,p.y,15,0,Math.PI*2);g.fill();
        g.restore();
      }else{
        const vehicle=C.vehicles[id];
        drawCar(g,{x:135,y:53,h:-.22,color:vehicle.color,vehicle},24,false,true);
      }
      input.addEventListener('change',()=>{updateGarage();saveSettings();});
    }
    const s=saved.settings;
    $('courseChoices').querySelector('input[value="'+(Object.hasOwn(C.courses,s.courseId)?s.courseId:'school')+'"]').checked=true;
    $('vehicleChoices').querySelector('input[value="'+(Object.hasOwn(C.vehicles,s.vehicleId)?s.vehicleId:'standard')+'"]').checked=true;
    restoreSettings();updateGarage();
  }
  function updateGarage(){
    $('courseDescription').textContent=activeCourse().description;
    $('vehicleDescription').textContent=C.vehicles[selected('vehicleId')].description;
  }
  setupGarage();
  let engine=null;
  function updateEngine(){
    const running=sound&&race?.state==='RACING'&&!document.hidden;
    if(!audio||audio.state!=='running')return;
    if(!running&&!engine)return;
    if(!engine){
      const oscillator=audio.createOscillator(),filter=audio.createBiquadFilter(),gain=audio.createGain();
      oscillator.type='triangle';filter.type='lowpass';filter.frequency.value=230;gain.gain.value=0;
      oscillator.connect(filter);filter.connect(gain);gain.connect(audio.destination);oscillator.start();
      engine={oscillator,gain};
    }
    const now=audio.currentTime;
    if(running)engine.oscillator.frequency.setTargetAtTime(33+race.player.v*3.1,now,.08);
    engine.gain.gain.setTargetAtTime(running?.028:0,now,.05);
  }
  function updateHud(){if(!race)return;const p=race.player;$('position').innerHTML=`${race.ranking().findIndex(c=>c.id===0)+1}<span>/ 4</span>`;$('lap').innerHTML=`${Math.min(p.laps+1,3)} <span>/ 3</span>`;$('timer').textContent=timeText(race.time);$('speed').textContent=Math.round(p.v*3.6);$('energy').innerHTML=`${p.energy} <small>/ 100</small>`;$('energyBar').style.width=p.energy+'%';$('boostBtn').disabled=race.state!=='RACING'||p.energy<40||p.boost>0||Math.abs(p.lateral)>race.course.at(p.s).halfWidth;$('itemName').textContent=p.item?itemNames[p.item]:'アイテムなし';$('itemGlyph').textContent=p.item?glyphs[p.item]:'◇';$('itemBtn').disabled=race.state!=='RACING'||!p.item;$('assistLabel').textContent='アシスト '+(race.config.assist?'ON':'OFF');$('questionProgress').textContent=`算数チャレンジ ${race.quizIndex} / 5`;
    const distance=race.course.quizDistances[race.quizIndex]-p.absS;let notice='';if(p.reverse>.6)notice='コースの進む向きに戻ろう';else if(Math.abs(p.lateral)>race.course.at(p.s).halfWidth+3)notice='コースの外です · Rキーで戻れます';else if(distance>=0&&distance<68)notice='この先に算数チャレンジ';else if(p.boost>0)notice='BOOST!';else if(p.shield>0)notice='シールド '+Math.ceil(p.shield)+'秒';else if(p.grip>0)notice='ハイグリップ '+Math.ceil(p.grip)+'秒';$('notice').textContent=notice;
    if(['COUNTDOWN','RESUME_COUNTDOWN'].includes(race.state)){const n=Math.max(1,Math.ceil(race.countdown));$('countdownNumber').textContent=n;if(n!==lastCount){lastCount=n;beep(330,.08);}}
    drawMini();
  }
  let hudElapsed=0;
  function frame(now){const elapsed=Math.min((now-lastFrame)/1000,.1);lastFrame=now;if(!document.hidden){if(!reduced&&!motionPreference.matches)menuTime+=elapsed;if(race){race.uiTick(elapsed);handleEvents();if(race.state==='RACING'){accumulator=Math.min(accumulator+elapsed,C.DT*5);while(accumulator>=C.DT&&race.state==='RACING'){race.step({h:Number(pressed('ArrowRight','KeyD'))-Number(pressed('ArrowLeft','KeyA')),a:pressed('ArrowUp','KeyW'),b:pressed('ArrowDown','KeyS')});accumulator-=C.DT;}handleEvents();}else accumulator=0;}drawWorld(elapsed);hudElapsed+=elapsed;if(hudElapsed>.08){updateHud();updateEngine();hudElapsed=0;}}requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
  // Read-only diagnostics for support and browser QA; no gameplay shortcuts.
  window.StudyRacers=Object.freeze({snapshot:()=>race?{state:race.state,time:race.time,quizIndex:race.quizIndex,answers:race.answers.map(a=>({...a})),cars:race.cars.map(c=>({id:c.id,x:c.x,y:c.y,v:c.v,progress:c.progress,laps:c.laps,energy:c.energy,boost:c.boost,finish:c.finish})),config:{...race.config}}:{state:'TITLE'},version:'2.0.0'});
})();


</script>
